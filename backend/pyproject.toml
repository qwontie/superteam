[project]
name = "pact"
version = "0.1.0"
description = "pact"
requires-python = ">=3.13"
dependencies = [
    "dishka>=1.10.1",
    "fastapi>=0.139.0",
    "pydantic-ai-slim[google]>=2.15.0",
    "pydantic-settings>=2.14.2",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.50.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["api", "utils", "dependencies", "services"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["CPY", "D1", "D203", "D212", "COM812", "BLE", "S101", "PT", "RUF001", "RUF002", "RUF003", "TRY301"]
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["INP", "T201", "ANN401"]
"*.lock" = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "ty>=0.0.55",
]
